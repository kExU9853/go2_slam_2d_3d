# nav2_params.yaml
amcl:
  ros__parameters:
    use_sim_time: false
    scan_topic: /scan
    odom_topic: /odom
    base_frame_id: base_footprint
    global_frame_id: map
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.2
    update_min_a: 0.2
    resample_interval: 1
    transform_tolerance: 0.1
    laser_min_range: 0.1
    laser_max_range: 30.0

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller/RegulatedPurePursuitController"
      lookahead_distance: 0.5
      min_lookahead_distance: 0.3
      max_lookahead_distance: 1.0
      max_angular_velocity: 1.0
      max_linear_velocity: 0.26
      control_period: 0.05

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5

behavior_server:
  ros__parameters:
    use_sim_time: false

bt_navigator:
  ros__parameters:
    use_sim_time: false

recoveries_server:
  ros__parameters:
    use_sim_time: false
    recovery_plugins: ["Spin", "BackUp"]
    Spin:
      plugin: "nav2_recoveries/Spin"
    BackUp:
      plugin: "nav2_recoveries/BackUp"

global_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    update_frequency: 1.0
    publish_frequency: 0.5
    transform_tolerance: 0.5
    static_map: true
    rolling_window: false
    resolution: 0.05
    width: 20.0
    height: 20.0
    plugins:
      - plugin: "nav2_costmap_2d::StaticLayer"
      - plugin: "nav2_costmap_2d::InflationLayer"

local_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_footprint
    update_frequency: 5.0
    publish_frequency: 2.0
    transform_tolerance: 0.5
    rolling_window: true
    resolution: 0.05
    width: 6.0
    height: 6.0
    plugins:
      - plugin: "nav2_costmap_2d::ObstacleLayer"
      - plugin: "nav2_costmap_2d::InflationLayer"

